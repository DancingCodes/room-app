# Gradle 后台进程最多使用 2GB 内存并采用 UTF-8；删除后会使用 Gradle 默认值，构建可能内存不足或出现编码差异。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 启用 AndroidX；删除后依赖 AndroidX 的应用和库无法正常构建。
android.useAndroidX=true
# 使用 Kotlin 官方代码风格；删除后由 IDE 或 Gradle 使用默认风格。
kotlin.code.style=official
# 每个库只生成自身资源的 R 类；删除后资源类会包含依赖资源，编译效率和资源隔离会变差。
android.nonTransitiveRClass=true
